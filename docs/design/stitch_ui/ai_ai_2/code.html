    let currentPercent = 68;
    const circumference = 364.4; // 2 * PI * 58

    const interval = setInterval(() => {
      if (currentPercent < 96) {
        currentPercent += Math.floor(Math.random() * 3) + 1;
        if (currentPercent > 96) currentPercent = 96;
        if (percentText) percentText.textContent = currentPercent;
        if (progressCircle) {
          const offset = circumference - (currentPercent / 100) * circumference;
          progressCircle.style.strokeDashoffset = offset;
        }
      }
    }, 1800);

    // Subtle micro-feedback on '后台推演' click
    if (bgBtn && notice) {
      bgBtn.addEventListener('click', () => {
