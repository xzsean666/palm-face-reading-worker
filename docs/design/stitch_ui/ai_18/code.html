<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&amp;family=Space+Grotesk:wght@100..900&amp;display=swap" rel="stylesheet"></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/85 backdrop-blur-xl shadow-[0_4px_20px_rgba(0,0,0,0.5)]"><div class="h-14 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-xs"><a class="flex items-center gap-space-xs" data-path="divination-dashboard" href="#"><img alt="天机AI预测大师 Logo徽章" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XSDyiDRz2fUkckep8ELUNUdiTk74wzR56IJUSv-ZF8Dh9Iltx1FaYcuHdS3kolY84UilJAQr51LLpu-TqsicPU-VpVdQaGTd2SehWHGAO115rv8dqf2cgzJHGMdxLzef3FwuytQ57fIzV5_ozbcYCd08J9OLWXt9QcC6JcYpTf4FvflFCw8ykY1eFO8eeAK2kY3HGSwCbmf5U_jqlrWh9-BYIP5xbZpYzjazCR0rh5b0leNKo9m7t-"><span class="font-headline-sm text-headline-sm text-primary tracking-wider">天机</span></a></div><div class="flex items-center gap-space-xs"><button aria-label="Notifications" class="w-11 h-11 relative flex items-center justify-center text-on-surface-variant active:scale-95 transition-transform"><span class="material-symbols-outlined text-[22px]">notifications</span><span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-error ring-2 ring-surface-container-lowest"></span></button><button aria-label="Quick Action" class="w-7 h-7 rounded-full bg-gradient-to-br from-primary-fixed to-primary flex items-center justify-center text-on-primary font-bold shadow-[0_0_12px_rgba(242,202,80,0.35)] active:scale-90 transition-transform"><span class="material-symbols-outlined text-[18px]">add</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center ml-space-xs"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-14 bg-surface min-h-screen"><div class="flex flex-col w-full pb-28">
<!-- 步骤条 -->
<div class="w-full px-margin pt-space-sm pb-space-sm bg-surface-container-lowest/60 backdrop-blur-md sticky top-0 z-30">
<div class="flex items-center justify-between max-w-sm mx-auto h-10 px-space-xs">
<div class="flex flex-col items-center relative pb-1">
<span class="font-headline-sm text-body-md text-primary font-semibold tracking-wide">1 填写信息</span>
<div class="absolute bottom-0 left-0 right-0 h-0.5 bg-primary rounded-full shadow-[0_0_8px_rgba(242,202,80,0.8)]"></div>
</div>
<div class="w-8 h-px bg-surface-container-highest"></div>
<div class="flex flex-col items-center pb-1">
<span class="font-body-md text-body-md text-outline">2 AI 推演</span>
</div>
<div class="w-8 h-px bg-surface-container-highest"></div>
<div class="flex flex-col items-center pb-1">
<span class="font-body-md text-body-md text-outline">3 查看报告</span>
</div>
</div>
</div>
<div class="px-margin flex flex-col gap-space-lg mt-space-sm">
<!-- 主表单卡片 -->
<div class="bg-surface-container-low rounded-xl p-space-md shadow-xl flex flex-col gap-space-lg relative overflow-hidden">
<!-- 极光玄学背景微光 -->
<div class="absolute -right-16 -top-16 w-40 h-40 rounded-full bg-secondary-container/20 blur-3xl pointer-events-none"></div>
<div class="absolute -left-16 -bottom-16 w-40 h-40 rounded-full bg-primary/10 blur-3xl pointer-events-none"></div>
<!-- 字段一：出生日期 -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-body-md text-body-md text-on-surface flex items-center gap-1 font-medium">
            出生日期 <span class="text-error font-bold">*</span>
</label>
<!-- 公历/农历开关 -->
<div class="bg-surface-container p-0.5 rounded-lg flex items-center text-label-sm font-label-sm">
<button class="px-space-sm py-1 rounded bg-primary text-on-primary font-semibold shadow-sm transition-all duration-200" id="tab-solar" onclick="switchCalendar('solar')" type="button">
              公历
            </button>
<button class="px-space-sm py-1 rounded text-on-surface-variant hover:text-on-surface transition-all duration-200" id="tab-lunar" onclick="switchCalendar('lunar')" type="button">
              农历
            </button>
</div>
</div>
<div class="relative flex items-center">
<div class="w-full h-12 bg-surface-container rounded-lg px-space-md flex items-center justify-between text-on-surface cursor-pointer active:bg-surface-bright transition-colors" onclick="document.getElementById('birthdate-picker').showPicker?.() || document.getElementById('birthdate-picker').focus()">
<span class="font-label-md text-body-lg text-on-surface tracking-wider" id="date-display">1995年08月16日</span>
<span class="material-symbols-outlined text-primary text-[22px]">calendar_month</span>
</div>
<input class="absolute inset-0 opacity-0 w-full h-full cursor-pointer" id="birthdate-picker" onchange="updateDateDisplay(this.value)" type="date" value="1995-08-16">
</div>
</div>
<!-- 字段二：出生时辰 -->
<div class="flex flex-col gap-space-xs">
<label class="font-body-md text-body-md text-on-surface flex items-center gap-1 font-medium">
          出生时辰 <span class="text-error font-bold">*</span>
</label>
<div class="relative">
<select class="w-full h-12 bg-surface-container rounded-lg px-space-md pr-10 text-on-surface font-body-md appearance-none focus:outline-none focus:bg-surface-bright transition-colors cursor-pointer" id="time-select">
<option value="zi">子时 (23:00-01:00)</option>
<option value="chou">丑时 (01:00-03:00)</option>
<option value="yin">寅时 (03:00-05:00)</option>
<option value="mao">卯时 (05:00-07:00)</option>
<option selected="" value="chen">辰时 (07:00-09:00)</option>
<option value="si">巳时 (09:00-11:00)</option>
<option value="wu">午时 (11:00-13:00)</option>
<option value="wei">未时 (13:00-15:00)</option>
<option value="shen">申时 (15:00-17:00)</option>
<option value="you">酉时 (17:00-19:00)</option>
<option value="xu">戌时 (19:00-21:00)</option>
<option value="hai">亥时 (21:00-23:00)</option>
</select>
<span class="material-symbols-outlined pointer-events-none absolute right-space-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">
            unfold_more
          </span>
</div>
<!-- 不清楚时辰便捷勾选 -->
<label class="flex items-center gap-2 mt-1 cursor-pointer select-none self-start">
<input class="w-4 h-4 rounded bg-surface-container accent-primary cursor-pointer" id="unknown-time" onchange="toggleUnknownTime(this.checked)" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant">不清楚具体时辰（将采用平旦起盘算法）</span>
</label>
</div>
<!-- 字段三：性别 -->
<div class="flex flex-col gap-space-xs">
<label class="font-body-md text-body-md text-on-surface flex items-center gap-1 font-medium">
          性别 <span class="text-error font-bold">*</span>
</label>
<div class="grid grid-cols-2 gap-space-md">
<!-- 乾造 男 -->
<div class="h-12 rounded-lg flex items-center justify-center gap-2 cursor-pointer transition-all duration-200 bg-primary/10 text-primary font-semibold shadow-[0_0_12px_rgba(242,202,80,0.15)]" id="gender-male" onclick="selectGender('male')">
<span class="material-symbols-outlined text-[20px]">male</span>
<span class="font-label-md text-label-md">乾造（男）</span>
</div>
<!-- 坤造 女 -->
<div class="h-12 rounded-lg flex items-center justify-center gap-2 cursor-pointer transition-all duration-200 bg-surface-container text-on-surface-variant hover:text-on-surface" id="gender-female" onclick="selectGender('female')">
<span class="material-symbols-outlined text-[20px]">female</span>
<span class="font-label-md text-label-md">坤造（女）</span>
</div>
</div>
</div>
<!-- 字段四：出生城市 -->
<div class="flex flex-col gap-space-xs">
<label class="font-body-md text-body-md text-on-surface flex items-center gap-1 font-medium">
          出生城市 <span class="text-error font-bold">*</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 bg-surface-container rounded-lg px-space-md pr-11 text-on-surface font-body-md placeholder:text-outline focus:outline-none focus:bg-surface-bright transition-colors" id="city-input" placeholder="例如：北京市海淀区" type="text" value="北京市海淀区">
<button class="absolute right-2 w-8 h-8 rounded-full flex items-center justify-center text-primary hover:bg-primary/10 active:scale-95 transition-transform" onclick="locateCity()" title="获取当前真太阳时校准坐标" type="button">
<span class="material-symbols-outlined text-[20px]">location_on</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-outline flex items-center gap-1 mt-0.5">
<span class="material-symbols-outlined text-[14px] text-tertiary">info</span>
          用于推算真太阳时与天体经纬度纠偏
        </p>
</div>
</div>
<!-- 价格与优惠区 -->
<div class="flex flex-col items-center justify-center gap-space-xs py-space-xs">
<div class="flex items-baseline gap-space-sm justify-center">
<span class="font-headline-lg text-headline-lg text-primary font-bold tracking-tight">本次测算 6 USDT</span>
<span class="font-body-sm text-body-sm text-outline line-through">9.9 USDT</span>
</div>
<div class="flex items-center gap-2">
<span class="bg-tertiary-container/20 text-tertiary font-label-sm text-label-sm px-2.5 py-0.5 rounded-full font-medium">
          会员 4.8 USDT
        </span>
</div>
</div>
<!-- 剩余免费次数行 -->
<div class="flex items-center justify-center gap-1.5 -mt-2">
<span class="material-symbols-outlined text-tertiary text-[18px]">verified</span>
<span class="font-label-md text-label-md text-tertiary font-medium">剩余免费次数：2 次</span>
</div>
<!-- 隐私承诺说明 -->
<div class="flex items-center justify-center gap-1.5 pb-space-sm">
<span class="material-symbols-outlined text-outline text-[16px]">lock</span>
<p class="font-body-sm text-body-sm text-outline text-center">
        您的生辰信息严格加密保护，仅用于命盘推演排盘
      </p>
</div>
</div>
<!-- 吸底操作栏 -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface-container-lowest/95 backdrop-blur-xl px-margin py-3 pb-safe shadow-[0_-8px_24px_rgba(0,0,0,0.6)]">
<div class="max-w-md mx-auto flex flex-col gap-1.5">
<button class="w-full h-12 rounded-full bg-gradient-to-r from-primary-fixed via-primary to-primary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-[0_4px_20px_rgba(242,202,80,0.35)] active:scale-98 transition-all" onclick="startDivination()" type="button">
<span class="material-symbols-outlined text-[20px]">auto_awesome</span>
<span class="">开始推演（免费）</span>
</button>
</div>
</div>
</div>
<script>
  function switchCalendar(type) {
    const solarBtn = document.getElementById('tab-solar');
    const lunarBtn = document.getElementById('tab-lunar');
    if (type === 'solar') {
      solarBtn.className = 'px-space-sm py-1 rounded bg-primary text-on-primary font-semibold shadow-sm transition-all duration-200';
      lunarBtn.className = 'px-space-sm py-1 rounded text-on-surface-variant hover:text-on-surface transition-all duration-200';
    } else {
      lunarBtn.className = 'px-space-sm py-1 rounded bg-primary text-on-primary font-semibold shadow-sm transition-all duration-200';
      solarBtn.className = 'px-space-sm py-1 rounded text-on-surface-variant hover:text-on-surface transition-all duration-200';
    }
  }

  function updateDateDisplay(val) {
    if (!val) return;
    const parts = val.split('-');
    if (parts.length === 3) {
      document.getElementById('date-display').innerText = `${parts[0]}年${parts[1]}月${parts[2]}日`;
    }
  }

  function toggleUnknownTime(checked) {
    const select = document.getElementById('time-select');
    select.disabled = checked;
    if (checked) {
      select.classList.add('opacity-40', 'cursor-not-allowed');
    } else {
      select.classList.remove('opacity-40', 'cursor-not-allowed');
    }
  }

  function selectGender(gender) {
    const maleBtn = document.getElementById('gender-male');
    const femaleBtn = document.getElementById('gender-female');
    if (gender === 'male') {
      maleBtn.className = 'h-12 rounded-lg flex items-center justify-center gap-2 cursor-pointer transition-all duration-200 bg-primary/10 text-primary font-semibold shadow-[0_0_12px_rgba(242,202,80,0.15)]';
      femaleBtn.className = 'h-12 rounded-lg flex items-center justify-center gap-2 cursor-pointer transition-all duration-200 bg-surface-container text-on-surface-variant hover:text-on-surface';
    } else {
      femaleBtn.className = 'h-12 rounded-lg flex items-center justify-center gap-2 cursor-pointer transition-all duration-200 bg-primary/10 text-primary font-semibold shadow-[0_0_12px_rgba(242,202,80,0.15)]';
      maleBtn.className = 'h-12 rounded-lg flex items-center justify-center gap-2 cursor-pointer transition-all duration-200 bg-surface-container text-on-surface-variant hover:text-on-surface';
    }
  }

  function locateCity() {
    const input = document.getElementById('city-input');
    input.value = '校准中...';
    setTimeout(() => {
      input.value = '北京市海淀区 (E116.3°, N39.9°)';
    }, 450);
  }

  function startDivination() {
    const btn = event.currentTarget;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>天机推衍中...</span>';
    btn.classList.add('opacity-80', 'pointer-events-none');
    setTimeout(() => {
      window.location.hash = '#divination-loading';
    }, 1000);
  }
</script></main>

</body></html>
